<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hanzi 1000</title>
  <meta name="description" content="Learn to read and say the 1000 most common Chinese characters in a 15-minute daily lesson.">
  <meta name="theme-color" content="#c8102e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="view"></main>

  <nav id="tabs" aria-label="Sections">
    <button data-tab="home" class="active"><span aria-hidden="true">🏠</span>Today</button>
    <button data-tab="chars"><span aria-hidden="true">字</span>Characters</button>
    <button data-tab="settings"><span aria-hidden="true">⚙️</span>Settings</button>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="icon-btn modal-close" aria-label="Close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="data/hanzi.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.2/dist/hanzi-writer.min.js" defer></script>
  <script src="js/store.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/panda.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
